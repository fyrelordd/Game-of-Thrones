<body>
  <div class="reveal-container">
    <h1>The Raven Has Spoken</h1>
    <img id="house-image" src="" alt="House Sigil" />
    <h2 id="house-name"></h2>
    <p id="house-traits"></p>
    <p id="house-quote"><em></em></p>
    <a href="./questions.html"><button>Back</button></a>
  </div>

  <script>
    
  document.addEventListener('DOMContentLoaded', () => {
    const stored = localStorage.getItem('quizAnswers');
    const answers = stored ? JSON.parse(stored) : [];

    const tally = {};
    answers.forEach(house => {
      house = house.toLowerCase();
      tally[house] = (tally[house] || 0) + 1;

      
    });

    let assignedHouse = null;
    let max = 0;

    for (let house in tally) {
      if (tally[house] > max) {
        max = tally[house];
        assignedHouse = house;
      }
    }

    if (!assignedHouse) {
  alert("Something went wrong. Please try the quiz again.");
  return;
}

    const names = {
      stark: 'House Stark',
      frey: 'House Frey',
      targaryen: 'House Targaryen',
      tully: 'House Tully',
      lannister: 'House Lannister',
      greyjoy: 'House Greyjoy',
      baratheon: 'House Baratheon',
      tyrell: 'House Tyrell',
      bolton: 'House Bolton',
      hightower: 'House Hightower',
      arryn: 'House Arryn',
      martell: 'House Martell'
    };

    const traits = {
      stark: 'Loyal, Resilient, Bound by Honor',
      frey: 'Cunning, Opportunistic, Patient',
      targaryen: 'Fierce, Ambitious, Unyielding',
      tully: 'Family, Duty, Honor',
      lannister: 'Powerful, Wealthy, Calculating',
      greyjoy: 'Bold, Rebellious, Seafaring',
      baratheon: 'Strong, Hot-blooded, Storm-born',
      tyrell: 'Wise, Charming, Strategic',
      bolton: 'Cruel, Cold, Calculating',
      hightower: 'Ancient, Scholarly, Patient',
      arryn: 'Noble, Just, Unyielding',
      martell: 'Proud, Passionate, Patient'
    };

    const quotes = {
      stark: '"Winter is Coming"',
      frey: '"We Stand Together"',
      targaryen: '"Fire and Blood"',
      tully: '"Family. Duty. Honor."',
      lannister: '"Hear Me Roar"',
      greyjoy: '"We Do Not Sow"',
      baratheon: '"Ours Is the Fury"',
      tyrell: '"Growing Strong"',
      bolton: '"Our Blades Are Sharp"',
      hightower: '"We Light the Way"',
      arryn: '"As High as Honor"',
      martell: '"Unbowed, Unbent, Unbroken"'
    };

    const images = {
      stark: './Stark/stark sigil.jpeg',
      frey: './Frey/frey sigil.jpeg',
      targaryen: './Targeryan/targeryan sigil.jpg',
      tully: './Tully/sigil.jpeg',
      lannister: './Lannister/lannister sigil.jpg',
      greyjoy: './Greyjoy/House Greyjoy.jpg',
      baratheon: './Baratheon/baratheon sigil.jpeg',
      tyrell: './Tyrell/tyrell sigil.jpeg',
      bolton: './Bolton/bolton sigil.jpeg',
      hightower: './Hightower/hightower sigil.jpeg',
      arryn: './Arryn/arryn sigil.jpeg',
      martell: './Martell/House Martell.jpg'
    };

    // Set house info in the DOM
    document.getElementById('house-image').src = images[assignedHouse];
    document.getElementById('house-image').alt = names[assignedHouse];
    document.getElementById('house-name').textContent = `Welcome To ${names[assignedHouse]}`;
    document.getElementById('house-traits').textContent = traits[assignedHouse];
    document.getElementById('house-quote').innerHTML = `<em>${quotes[assignedHouse]}</em>`;

    // Handle background animation
    const body = document.body;

    switch (assignedHouse) {
      case 'lannister':
        body.style.animation = 'backgroundSliderLannister 25s infinite';
        break;
      case 'targaryen':
        body.style.animation = 'backgroundSliderTargaryen 25s infinite';
        break;
      case 'martell':
        body.style.animation = 'backgroundSliderMartell 25s infinite';
        break;
      case 'arryn':
        body.style.animation = 'backgroundSliderArryn 25s infinite';
        break;
      case 'baratheon':
        body.style.animation = 'backgroundSliderBaratheon 25s infinite';
        break;
      case 'bolton':
        body.style.animation = 'backgroundSliderBolton 25s infinite';
        break;
      case 'frey':
        body.style.animation = 'backgroundSliderFrey 25s infinite';
        break;
      case 'greyjoy':
        body.style.animation = 'backgroundSliderGreyjoy 25s infinite';
        break;
      case 'hightower':
        body.style.animation = 'backgroundSliderHightower 25s infinite';
        break;
      case 'tully':
        body.style.animation = 'backgroundSliderTully 25s infinite';
        break;
      case 'tyrell':
        body.style.animation = 'backgroundSliderTyrell 25s infinite';
        break;
      case 'stark':
        body.style.animation = 'backgroundSliderStark 25s infinite';
        break;

      default:
        console.warn(`Unknown house "${assignedHouse}", falling back to Night's Watch`);
        body.style.animation = 'backgroundSlider 25s infinite';
        break;
    }

    const container = document.querySelector('.reveal-container');
container.classList.add(assignedHouse); // This applies the appropriate styling
  });

  </script>
  
</body>
</html>
